[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "codis"
version     = "1.0.1"
description = "Editor de código moderno, 100% Python + Tkinter - sem Electron, sem Node, sem dependências obrigatórias."
readme      = { file = "README.md", content-type = "text/markdown" }
license     = { text = "MIT" }
requires-python = ">=3.12"

dependencies = []

authors = [
    { name = "KillovSky" },
]

keywords = [
    "editor", "code", "ide", "tkinter", "python",
    "codis", "text-editor", "syntax-highlighting", "lsp",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Text Editors",
]

[project.urls]
Homepage      = "https://github.com/KillovSky/Codis"
Repository    = "https://github.com/KillovSky/Codis"
"Bug Tracker" = "https://github.com/KillovSky/Codis/issues"
Changelog     = "https://github.com/KillovSky/Codis/blob/main/CHANGELOG.md"
Wiki          = "https://github.com/KillovSky/Codis/wiki"

[project.scripts]
codis = "run:main"

[project.gui-scripts]
codis-gui = "run:main"

[project.optional-dependencies]
recommended = [
    "send2trash>=1.8.0",
    "Pillow>=10.0.0",
    "markdown>=3.4.0",
    "psutil>=5.9.0",
    "charset-normalizer>=3.0.0",
    "websockets>=12.0",
    "Pygments>=2.17.0",
    'pywinpty>=3.0.5; sys_platform == "win32"',
]

full = [
    "send2trash>=1.8.0",
    "Pillow>=10.0.0",
    "markdown>=3.4.0",
    "psutil>=5.9.0",
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    "websockets>=12.0",
    "Pygments>=2.17.0",
    "py7zr>=0.20.0",
    "rarfile>=4.0",
    'pywinpty>=3.0.5; sys_platform == "win32"',
    'tomli>=2.0.0; python_version < "3.11"',
]

dev = [
    "pyinstaller>=6.0",
    "build>=1.0",
    "twine>=5.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "pylint>=3.0",
    "mypy>=1.8",
    "ruff>=0.4",
    "black>=24.0",
    "isort>=5.13",
    "radon>=6.0",
    "vulture>=2.10",
    "bandit>=1.7",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where   = ["."]
include = ["src*"]
exclude = ["tests*", "docs*", "wiki*", "build*", "dist*"]

[tool.setuptools.package-data]
"*" = [
    "src/locales/*.json",
    "wiki/*.md",
    "assets/*",
]

[tool.pytest.ini_options]
testpaths    = ["tests"]
pythonpath   = ["."]
python_files = ["test_*.py", "*_test.py"]
addopts      = [
    "--tb=short",
    "--strict-markers",
    "-q",
]
markers = [
    "slow: testes que demoram mais de 1s",
    "gui: testes que exigem display (Tkinter)",
    "integration: testes de integração end-to-end",
]

[tool.coverage.run]
source  = ["src"]
omit    = [
    "src/locales/*",
    "tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version         = "3.12"
strict                 = false
ignore_missing_imports = true
warn_unused_ignores    = true
warn_redundant_casts   = true
show_error_codes       = true
exclude                = ["tests/", "build/", "dist/"]

[tool.ruff]
target-version = "py312"
line-length    = 100
exclude        = [
    ".git", ".venv", "venv", "dist", "build",
    "__pycache__", ".pytest_cache", ".mypy_cache",
]

[tool.ruff.lint]
select  = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore  = [
    "E501",
    "B008",
    "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.bandit]
targets  = ["src"]
skips    = [
    "B101",
    "B603",
    "B607",
]
